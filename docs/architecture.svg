<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-violet" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="760" fill="#ffffff"/>

  <!-- title -->
  <text x="640" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#1e293b">Muse AI Phone Assistant — Architecture</text>
  <text x="640" y="70" text-anchor="middle" font-size="15" fill="#64748b">You give the order · Muse operates · Telnyx provides the number, the line, and the voice assistant</text>

  <!-- ===== top flow: 5 boxes ===== -->
  <!-- You -->
  <rect x="20" y="100" width="215" height="190" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="127" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#1e40af">You</text>
  <text x="127" y="152" text-anchor="middle" font-size="12.5" fill="#475569">Phone · Muse app</text>
  <line x1="36" y1="164" x2="219" y2="164" stroke="#bfdbfe" stroke-width="1"/>
  <text x="36" y="192" font-size="13" fill="#1e293b">Give the order: who to call,</text>
  <text x="36" y="212" font-size="13" fill="#1e293b">what to ask or book</text>
  <text x="36" y="244" font-size="13" fill="#1e293b">Take the call (test calls)</text>
  <text x="36" y="276" font-size="13" fill="#1e293b">Get the report: what was said</text>

  <!-- Muse + Skill -->
  <rect x="265" y="100" width="235" height="190" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="382" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">Muse + Skill</text>
  <text x="382" y="152" text-anchor="middle" font-size="12.5" fill="#475569">Operator — never on the call</text>
  <line x1="281" y1="164" x2="484" y2="164" stroke="#ddd6fe" stroke-width="1"/>
  <text x="281" y="192" font-size="13" fill="#1e293b">setup.py — install / sync</text>
  <text x="281" y="212" font-size="13" fill="#1e293b">call.py — dial + task brief</text>
  <text x="281" y="232" font-size="13" fill="#1e293b">review.py — transcript + audio</text>
  <text x="281" y="264" font-size="12" fill="#64748b">Confirms every call with you</text>
  <text x="281" y="282" font-size="12" fill="#64748b">before dialling.</text>

  <!-- Telnyx API -->
  <rect x="530" y="100" width="215" height="190" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="637" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">Telnyx API</text>
  <text x="637" y="152" text-anchor="middle" font-size="12.5" fill="#475569">api.telnyx.com</text>
  <line x1="546" y1="164" x2="729" y2="164" stroke="#bbf7d0" stroke-width="1"/>
  <text x="546" y="192" font-size="13" fill="#1e293b">POST /v2/calls</text>
  <text x="546" y="212" font-size="13" fill="#1e293b">GET /v2/ai/conversations</text>
  <text x="546" y="232" font-size="13" fill="#1e293b">GET /v2/recordings</text>
  <text x="546" y="264" font-size="12" fill="#64748b">Warms the assistant up</text>
  <text x="546" y="282" font-size="12" fill="#64748b">while the phone rings.</text>

  <!-- AI Assistant -->
  <rect x="775" y="100" width="240" height="190" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="895" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">AI Assistant</text>
  <text x="895" y="152" text-anchor="middle" font-size="12.5" fill="#475569">One general assistant</text>
  <line x1="791" y1="164" x2="999" y2="164" stroke="#fed7aa" stroke-width="1"/>
  <text x="791" y="192" font-size="13" fill="#1e293b">Brain: GPT-5.6-Sol</text>
  <text x="791" y="212" font-size="13" fill="#1e293b">Ears: Deepgram Flux</text>
  <text x="791" y="232" font-size="13" fill="#1e293b">Voice: Telnyx Ultra (0.9×)</text>
  <text x="791" y="264" font-size="12" fill="#64748b">Holds only the shared rules;</text>
  <text x="791" y="282" font-size="12" fill="#64748b">each call adds its own brief.</text>

  <!-- PSTN -->
  <rect x="1045" y="100" width="215" height="190" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="1152" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#9d174d">PSTN</text>
  <text x="1152" y="152" text-anchor="middle" font-size="12.5" fill="#475569">The called party</text>
  <line x1="1061" y1="164" x2="1244" y2="164" stroke="#fbcfe8" stroke-width="1"/>
  <text x="1061" y="192" font-size="13" fill="#1e293b">Clinic · restaurant · shop</text>
  <text x="1061" y="212" font-size="13" fill="#1e293b">Customer service · anyone</text>
  <text x="1061" y="244" font-size="13" fill="#1e293b">Hears a real phone call from</text>
  <text x="1061" y="264" font-size="13" fill="#1e293b">your Telnyx number.</text>

  <!-- arrows across the top row -->
  <line x1="235" y1="195" x2="262" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="195" x2="527" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="745" y1="195" x2="772" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1015" y1="195" x2="1042" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== per-call overrides band ===== -->
  <rect x="265" y="320" width="750" height="86" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="640" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Per call, Muse passes two things — nothing else is stored per scenario</text>
  <text x="640" y="374" text-anchor="middle" font-size="13.5" fill="#334155">greeting — the exact opening line for this call (static string, so the audio is ready in ~1s)</text>
  <text x="640" y="396" text-anchor="middle" font-size="13.5" fill="#334155">dynamic_variables.task_brief — what to ask, book, or confirm; fills {{task_brief}} in the instructions</text>
  <!-- arrow from band up to assistant -->
  <line x1="895" y1="320" x2="895" y2="293" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-violet)"/>

  <!-- ===== bottom: two loops ===== -->
  <!-- Review loop -->
  <rect x="20" y="440" width="600" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="470" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">Review loop — after every call</text>
  <line x1="36" y1="482" x2="604" y2="482" stroke="#bfdbfe" stroke-width="1"/>
  <text x="36" y="510" font-size="13.5" fill="#1e293b">Transcript + timing + recording flow back from Telnyx.</text>
  <text x="36" y="534" font-size="13.5" fill="#1e293b">review.py reports: greeting latency, what was agreed,</text>
  <text x="36" y="558" font-size="13.5" fill="#1e293b">and whether the hangup tool fired (call ended promptly).</text>
  <text x="36" y="582" font-size="12" fill="#64748b">Recording is dual-channel — one side per channel.</text>

  <!-- Update loop -->
  <rect x="660" y="440" width="600" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="960" y="470" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">Update loop — how installed users stay current</text>
  <line x1="676" y1="482" x2="1244" y2="482" stroke="#ddd6fe" stroke-width="1"/>
  <text x="676" y="510" font-size="13.5" fill="#1e293b">1. git pull — refresh the code and assistant template.</text>
  <text x="676" y="534" font-size="13.5" fill="#1e293b">2. setup.py --sync — re-apply the template to the</text>
  <text x="676" y="558" font-size="13.5" fill="#1e293b">assistant on Telnyx (current config backed up first).</text>
  <text x="676" y="582" font-size="12" fill="#64748b">One command does both: bash scripts/update.sh</text>

  <!-- ===== bottom strip: key numbers ===== -->
  <rect x="20" y="620" width="1240" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="640" y="650" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Tuning that is baked into the template (change in templates/assistant.json, then setup.py --sync)</text>
  <text x="80" y="682" font-size="13.5" fill="#334155">Greeting delay 0 ms — speaks immediately after pickup</text>
  <text x="80" y="706" font-size="13.5" fill="#334155">Voice speed 0.9 — slightly slower, clearer</text>
  <text x="680" y="682" font-size="13.5" fill="#334155">Silence follow-up after 10 s · hang up after 40 s of silence</text>
  <text x="680" y="706" font-size="13.5" fill="#334155">Hard cap 300 s per call · hangup tool ends the call on goodbye</text>

  <text x="640" y="748" text-anchor="middle" font-size="12" fill="#94a3b8">Outbound only · English by default · US/CA destinations by default · No OpenAI key needed for the default path</text>
</svg>
